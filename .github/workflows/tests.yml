name: tests

on:
  push:
    branches: [main, clean-v5-build]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile skillcheck_bot.py run.py core/*.py core/detectors/*.py tools/preflight.py
      - run: python -m pytest -q
