name: Region resolution regression

on:
  push:
    branches:
      - fix/1600x900-region-scale
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pytest -q tests/test_region_resolution.py
