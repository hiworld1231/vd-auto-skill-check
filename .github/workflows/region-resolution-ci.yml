name: Region resolution regression

on:
  push:
    branches:
      - fix/1600x900-region-scale

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1600x900-region-scale
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Apply normalized region detector fix
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('vd/runtime.py')
          text = runtime.read_text()
          old = "            ui_scale=(1920/source_size[0] if capture_source=='region' and source_size\n                      and source_size[0]>0 else 1.0)\n"
          new = "            # Region capture already normalizes the scaled physical ROI.\n            ui_scale=1.0\n"
          assert old in text, 'runtime region scale block changed unexpectedly'
          runtime.write_text(text.replace(old, new, 1))

          tests = Path('tests/test_physical_runtime_mock.py')
          text = tests.read_text()
          old_name = 'def test_region_runtime_scales_detector_for_1600px_source(monkeypatch, tmp_path):'
          new_name = 'def test_region_runtime_keeps_normalized_detector_scale_for_1600px_source(monkeypatch, tmp_path):'
          assert old_name in text, 'legacy region test name changed unexpectedly'
          text = text.replace(old_name, new_name, 1)
          old_assert = "    assert manifest['detector_ui_scale'] == 1.2\n"
          new_assert = "    assert manifest['detector_ui_scale'] == 1.0\n"
          assert old_assert in text, 'legacy region scale expectation changed unexpectedly'
          tests.write_text(text.replace(old_assert, new_assert, 1))
          PY
      - run: python -m pytest -q tests/test_region_resolution.py tests/test_physical_runtime_mock.py -k region
      - name: Commit fix to branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vd/runtime.py tests/test_physical_runtime_mock.py
          git diff --cached --quiet && exit 0
          git commit -m 'Fix normalized region detector scale'
          git push origin HEAD:fix/1600x900-region-scale
