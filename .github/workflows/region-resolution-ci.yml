name: Region resolution regression

on:
  push:
    branches:
      - fix/1600x900-region-scale

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-numpy python3-gi \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Disable runner Chromium bench
        run: |
          browser="$(command -v chromium || true)"
          if [ -n "$browser" ]; then sudo chmod -x "$browser"; fi
      - run: python -m pytest -q
