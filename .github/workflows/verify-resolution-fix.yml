name: verify resolution fix

on:
  pull_request:
  push:
    branches:
      - fix/1600x900-monitor-roi

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg python-is-python3 python3-gi python3-gst-1.0 python3-numpy \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Install Python test dependencies
        run: |
          python3 -m venv --system-site-packages .ci-venv
          .ci-venv/bin/pip install --upgrade pip
          .ci-venv/bin/pip install -r requirements.txt
      - name: Run test suite
        run: |
          sudo chmod -x /usr/bin/chromium 2>/dev/null || true
          .ci-venv/bin/python -m pytest -q
