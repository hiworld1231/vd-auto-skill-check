<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VD solver bench</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;background:#080a0c;color:white;font:13px system-ui}
  #status{position:absolute;left:16px;top:16px;padding:9px 12px;background:#164c39;max-width:750px}
  #result{position:absolute;left:16px;top:58px;font-weight:bold}
  #stage{position:absolute;left:800px;top:420px;width:320px;height:240px;background:#101317}
  svg{width:320px;height:240px;display:none}
  #ring{fill:none;stroke:#e5e9eb;stroke-width:2.5}
  #great{fill:none;stroke:#fff;stroke-width:10}
  #good{fill:none;stroke:#090b0d;stroke-width:7}
  #needle{stroke:#e83d43;stroke-width:2.5;stroke-linecap:round}
  #hub{fill:#090b0d}
</style>
<div id="status">SOLVER BENCH · 1920×1080 · hold LMB for solver · F toggles Frenzy · Space tests manually</div>
<div id="result" aria-live="polite"></div>
<div id="stage">
  <svg id="check" viewBox="0 0 320 240" aria-label="Skill check">
    <circle id="ring" cx="160" cy="162.5" r="66.5"/>
    <path id="good"/>
    <path id="great"/>
    <line id="needle" x1="160" y1="162.5" x2="160" y2="90"/>
    <circle id="hub" cx="160" cy="162.5" r="4"/>
    <image href="../assets/space_template.png" x="125" y="145" width="70" height="35"/>
  </svg>
</div>
<script>
(() => {
  const $=id=>document.getElementById(id);
  const center={x:160,y:162.5};
  const zones=[40,160,285,75,215,350];
  let count=0,active=false,frenzy=false,phase=270,speed=300,last=performance.now();
  let target=zones[0],started=last,spawnTimer;
  const point=(angle,r)=>({x:center.x+r*Math.cos(angle*Math.PI/180),y:center.y+r*Math.sin(angle*Math.PI/180)});
  function arc(start,width){
    const a=point(start,66.5),b=point(start+width,66.5);
    return `M ${a.x} ${a.y} A 66.5 66.5 0 ${width>180?1:0} 1 ${b.x} ${b.y}`;
  }
  function show(){
    target=zones[count%zones.length];count++;started=performance.now();active=true;
    $('great').setAttribute('d',arc(target,10));
    $('good').setAttribute('d',arc(target+11,42));
    $('check').style.display='block';
    $('status').textContent=`SOLVER BENCH · check ${count} · ${frenzy?'FRENZY':'normal'} · ${speed}°/s · hold LMB · F toggles Frenzy`;
  }
  function resolve(label){
    $('result').textContent=`Check ${count}: ${label}`;
    $('result').style.color=label==='GREAT'?'#40ed9d':label==='GOOD'?'#ffdd60':'#ff6b75';
    active=false;
    if(label==='MISS') frenzy=false;
    if(!frenzy) $('check').style.display='none';
    spawnTimer=setTimeout(show,frenzy?150:900);
  }
  function tick(now){
    const dt=Math.min(.1,(now-last)/1000);last=now;phase+=speed*dt;
    if(active||frenzy){
      const tip=point(phase,74);
      $('needle').setAttribute('x2',tip.x);$('needle').setAttribute('y2',tip.y);
    }
    if(active && phase>=target+360 && now-started>500) resolve('MISS');
    requestAnimationFrame(tick);
  }
  addEventListener('keydown',event=>{
    if(event.code==='KeyF'&&!event.repeat){
      frenzy=!frenzy;speed=frenzy?700:300;
      if(frenzy){active=false;clearTimeout(spawnTimer);show();}
      $('status').textContent=frenzy?'FRENZY ON · hold LMB · Space tests manually':'FRENZY OFF · hold LMB';
    }
    if(event.code==='Space'&&!event.repeat&&active){
      event.preventDefault();
      const angle=phase%360;
      const offset=(angle-target+360)%360;
      resolve(offset<=10?'GREAT':offset>=11&&offset<=53?'GOOD':'MISS');
    }
  });
  window.VDBenchState=()=>({count,active,frenzy,phase,target});
  spawnTimer=setTimeout(show,600);
  requestAnimationFrame(tick);
})();
</script>
</html>
